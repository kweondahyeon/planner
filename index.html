<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FFFFFF">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Planner">
<title>Planner — 업무 캘린더</title>
<style>
:root{
  --bg:#FAFAFA; --surface:#FFFFFF; --line:#E7E7EA; --line2:#D9D9DE;
  --text:#18181B; --sub:rgba(0,0,0,.4); --faint:rgba(0,0,0,.4); --out:#FAFAFA; --gray:rgba(0,0,0,.4);
  --red:#E5484D; --today:#F24822; --accent:#18181B;
  --work:#1C1C1F; --work-fg:#FFFFFF; --work-d-bg:#EBEBEB; --work-d-fg:rgba(0,0,0,.4);
  --acct:#B4873A; --acct-fg:#FFFFFF; --acct-d-bg:#F2EAD9; --acct-d-fg:#B49E77;
  --rel:#0070F0;
  --vac:#F4AAAB; --vac-fg:#7A2326;
  --memo-bd:#C4C4CB; --memo-fg:#4B4B53;
  --selbg:#F5F5F5;
  --bar-h:14px; --bar-fs:11px; --bar-gap:4px; --head-h:36px; --gutter:40px;
  font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Helvetica Neue","Malgun Gothic",sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
input,textarea,select{font:inherit;color:inherit}
#app{display:flex;flex-direction:column;height:100%;min-height:0;width:min(100% - 120px, max(72%, 1320px));margin:0 auto;padding:32px 0 32px}

/* ---------- Top bar ---------- */
.topbar{display:flex;align-items:center;gap:16px;padding:0 0 24px;flex-wrap:wrap}
.title{display:flex;align-items:center;gap:8px}
.title h1{margin:0;font-size:30px;font-weight:800;letter-spacing:-.03em;text-align:center;white-space:nowrap}
.iconbtn{width:32px;height:32px;border-radius:8px;display:grid;place-items:center;color:var(--sub)}
.iconbtn:hover{background:#E9E9EC;color:var(--text)}
.pill{height:32px;padding:0 12px;border-radius:8px;border:1px solid var(--line2);background:var(--surface);font-size:13px;font-weight:600}
.pill:hover{border-color:#BDBDC4}
.tlink{display:flex;align-items:center;gap:4px;height:32px;padding:0 8px;font-size:13px;font-weight:600;color:var(--sub);white-space:nowrap}
.tlink:hover{color:var(--text)}
.tlink svg{flex:none}
#backBtn{display:none}
body.mode-review #backBtn{display:grid}
body.mode-review #yprev,body.mode-review #ytitle,body.mode-review #ynext,body.mode-review #reviewBtn,body.mode-review #mseg,body.mode-review #todayBtn,body.mode-review #todoBtn,body.mode-review .strip,body.mode-review .stats{display:none}
.pill.on{background:var(--accent);border-color:var(--accent);color:#fff}
.seg{display:flex;background:#EBEBEE;border-radius:9px;padding:4px;gap:4px}
#mseg{background:var(--surface);border-radius:10px}
#mseg button{border-radius:8px;padding:0 8px}
#mseg button.on{background:var(--accent);color:#fff;box-shadow:none}
body:not(.mode-review) #mtitle{display:none}
#mseg button{display:flex;align-items:center;gap:4px}
#mseg .eye{display:none;line-height:0}
#mseg button.on .eye{display:block}
.seg button{flex:1;height:26px;padding:0 12px;border-radius:7px;font-size:12px;font-weight:600;color:var(--sub);white-space:nowrap}
.seg button.on{background:#fff;color:var(--text);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.strip{display:flex;align-items:center;gap:4px;background:var(--surface);border-radius:10px;padding:4px}
.strip .yr{font-size:12px;font-weight:700;color:var(--sub);padding:0 8px;min-width:42px;text-align:center}
.strip .yb{width:22px;height:26px;border-radius:6px;color:var(--faint)}
.strip .yb:hover{background:#F0F0F2;color:var(--text)}
.mchip{position:relative;height:26px;min-width:32px;padding:0 8px;border-radius:8px;font-size:12px;font-weight:600;color:var(--text);display:flex;align-items:center;justify-content:center;gap:4px}
.mchip:hover{background:#F0F0F2}
.mchip.on{background:var(--accent);color:#fff}
.mchip.on2{background:#E4E4E7;color:var(--text)}
.mchip.empty:not(.on):not(.on2){color:var(--sub)}
.mchip.cur::before{content:"";width:4px;height:4px;border-radius:50%;background:var(--today);flex:none}
.spacer{flex:1}
.stats{font-size:12px;color:var(--sub);display:flex;gap:16px;white-space:nowrap}
.stats b{color:#000;font-weight:700}
.stats .tot{color:var(--gray);font-weight:600}

/* ---------- Layout ---------- */
main{flex:1;display:flex;gap:16px;padding:0;min-height:0}
body.mode-review .cal, body.mode-review .panel{display:none}
.cal.anchored,.pb.scratch.daytop,.pb.scratch.daybot{box-shadow:0 0 0 1px #000}
.cal{flex:1;min-width:0;background:var(--surface);border-radius:20px;display:flex;flex-direction:column;overflow:hidden}
.dow{display:grid;grid-template-columns:var(--gutter) minmax(0,1fr);border-bottom:1px solid var(--line)}
.dow .cols{grid-column:2;display:grid;grid-template-columns:repeat(var(--cols),minmax(0,1fr))}
.dow span{padding:12px 12px 8px;font-size:12px;font-weight:700;color:var(--sub);text-align:left}
.weeks{flex:1;overflow:auto;user-select:none;-webkit-user-select:none;display:flex;flex-direction:column;overscroll-behavior:contain}
.wk b{display:block;color:var(--sub);font-weight:800;margin-bottom:4px}
.week{position:relative;display:grid;grid-template-columns:var(--gutter) minmax(0,1fr);border-bottom:1px solid var(--line);flex:1 1 0;overflow:hidden}
.cell{--cellbg:var(--surface)} .cell.out{--cellbg:var(--out)} .cell.insel{--cellbg:var(--selbg)}
.moren{position:absolute;left:0;right:0;bottom:0;z-index:2;background:var(--cellbg);padding:0 8px;font-size:11px;font-weight:700;line-height:var(--bar-h);color:var(--sub);cursor:pointer}
.weeks > .week:last-child{border-bottom:0}
.wk{font-size:10px;font-weight:700;color:var(--faint);padding:12px 0 0 12px;letter-spacing:.02em}
.cells{grid-column:2;display:grid;grid-template-columns:repeat(var(--cols),minmax(0,1fr));position:relative}
.cell{border-left:1px solid var(--line);padding:8px 8px 0;min-width:0;cursor:pointer;position:relative}
.cell:hover{background:#FBFBFC;--cellbg:#FBFBFC}
.cell.out{background:var(--out)}
.cell.out .num{color:rgba(0,0,0,.4)}
.cell.insel,.cell.insel:hover{background:var(--selbg)}
.dhead{display:flex;align-items:center;gap:8px;height:24px;min-width:0}
.num{font-size:14px;font-weight:700;letter-spacing:-.02em;flex:none;min-width:22px;height:22px;display:grid;place-items:center;border-radius:11px;padding:0 4px}
.cell.hol .num{color:var(--red)}
.cell.today .num,.cell.hol.today .num{display:flex;align-items:center;gap:4px;color:var(--text)}
.cell.today .num::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--today);flex:none}
.cell.out.today .num{color:rgba(0,0,0,.4)}
.hname{font-size:10px;font-weight:600;color:var(--red);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.hname.custom{color:#9A6B6D}
.cell.out .hname{opacity:.5}
.bars{position:absolute;left:var(--gutter);right:0;top:var(--head-h);pointer-events:none}
.bar{pointer-events:auto;touch-action:none;margin:0 4px;height:var(--bar-h);border-radius:3px;display:flex;align-items:center;gap:4px;padding:0 4px;font-size:var(--bar-fs);line-height:var(--bar-h);font-weight:600;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;cursor:grab;position:absolute;top:0;min-width:0}
.bar{height:auto;min-height:var(--bar-h);align-items:flex-start;white-space:normal}
.bar .t{overflow:hidden;min-width:0;flex:1;white-space:pre-line;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:3;word-break:break-all}
.bar.cl{border-top-left-radius:0;border-bottom-left-radius:0;margin-left:0}
.bar.cr{border-top-right-radius:0;border-bottom-right-radius:0;margin-right:0}
.bar.dragging{opacity:.3}
.bar.ghost{position:fixed;z-index:100;margin:0;pointer-events:none;opacity:.95;box-shadow:0 6px 18px rgba(0,0,0,.22);border-radius:3px}
body.bardrag, body.bardrag *{cursor:grabbing !important}
body.bardrag .bar{pointer-events:auto}
.cell.drop{background:#ECECEC}
.bar .rz{position:absolute;right:0;top:0;bottom:0;width:6px;cursor:ew-resize}
.bar.cr .rz{display:none}
.t-work{background:var(--work);color:var(--work-fg)}
.t-work.done{background:var(--work-d-bg);color:var(--work-d-fg)}
.t-acct{background:var(--acct);color:var(--acct-fg)}
.t-acct.done{background:var(--acct-d-bg);color:var(--acct-d-fg)}
.t-rel{background:var(--rel);color:#fff}
.t-vac{background:var(--vac);color:var(--vac-fg)}
.t-memo{background:#fff;color:var(--memo-fg);box-shadow:inset 0 0 0 1px rgba(0,0,0,.08);font-weight:600;height:auto;min-height:var(--bar-h);align-items:flex-start;padding:0 4px;font-size:var(--bar-fs);line-height:var(--bar-h)}
.t-memo .ic{flex:none;opacity:.6;margin-top:4px}
.t-memo .t{white-space:pre-line;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:3;word-break:break-all}

/* ---------- Panel ---------- */
.panel{width:340px;flex:none;background:var(--surface);border-radius:20px;display:flex;flex-direction:column;overflow:hidden}
.ph{padding:20px 20px 12px;border-bottom:1px solid var(--line)}
.ph .d1{font-size:20px;font-weight:800;letter-spacing:-.03em;display:flex;align-items:center;gap:8px}
.ph .d2{margin-top:8px;display:flex;gap:8px;flex-wrap:wrap}
.tag{font-size:11px;font-weight:700;padding:2px 6px;border-radius:80px;letter-spacing:0;line-height:1.5;background:#F1F1F3;color:var(--sub)}
.tag.red{background:#FDECEC;color:var(--red)}
.pb{flex:1;overflow:auto;padding:16px 20px 20px}
.pb.day{display:flex;flex-direction:column}
.composer{flex:1 0 auto;display:flex;flex-direction:column;min-height:240px}
.lists{flex:none;margin:8px -8px 0}
.dtitle{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.alldone{margin-left:auto;display:flex;align-items:center;gap:6px;flex:none;font-size:12px;font-weight:600;letter-spacing:0;color:var(--text);padding:4px 0}
.alldone .ck{width:14px;height:14px;border-radius:4px;border:1.5px solid #B7B7BE;display:grid;place-items:center;background:#fff}
.alldone .ck.on{background:var(--text);border-color:var(--text)}
.alldone .ck svg{width:9px;height:9px;display:none}
.alldone .ck.on svg{display:block}
.alldone:hover{opacity:.7}
.pb.scratch.daytop{flex:0 1 auto;max-height:60%;min-height:0}
.pb.scratch.daybot{flex:1 1 0;min-height:0}
.daybot .composer{min-height:0;margin-top:12px}
.lists .div{height:1px;background:rgba(0,0,0,.12);margin:8px 0}
.composer textarea{display:block;flex:1;width:100%;border:0;outline:0;resize:none;background:transparent;font-size:14px;line-height:1.5;min-height:100px;padding:16px 0 4px}
.types{display:flex;gap:4px;flex-wrap:wrap}
.tchip{height:28px;padding:0 8px;border-radius:7px;font-size:12px;font-weight:600;letter-spacing:0;background:#fff;color:var(--sub);display:flex;align-items:center;gap:4px;border:1px solid var(--line)}
.tchip i{width:9px;height:9px;border-radius:2px;display:block}
.tchip.on{border-color:var(--text);color:var(--text);background:#fff}
.dates{margin-top:12px}
.dates .lbl{display:flex;justify-content:space-between;align-items:center;font-size:11px;font-weight:600;color:var(--sub);margin-top:8px}
.dates .lbl b{font:inherit;color:inherit}
.drow{display:flex;align-items:center;gap:8px;color:var(--faint);font-size:12px}
.dbtn{position:relative;flex:1;height:34px;border:1px solid var(--line2);border-radius:8px;background:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 12px;font-size:14px;font-weight:400;letter-spacing:0;color:var(--text);cursor:pointer}
.dbtn:hover{border-color:#B5B5BC}
.dbtn svg{color:var(--faint)}
.dbtn input{position:absolute;inset:0;width:100%;height:100%;opacity:0;border:0;padding:0;cursor:pointer}
.dbtn input::-webkit-calendar-picker-indicator{position:absolute;inset:0;width:auto;height:auto;cursor:pointer}
.btn{height:32px;padding:0 16px;border-radius:8px;background:var(--accent);color:#fff;font-size:13px;font-weight:700}
.btn.full{width:100%;height:40px;margin-top:12px}
.btn:disabled{background:#EBEBEB;color:rgba(0,0,0,.4);cursor:default}
.btn.ghost{background:transparent;color:var(--sub);border:1px solid var(--line2)}
.btn.danger{background:transparent;color:var(--red);border:1px solid #F3C5C6}
.sec{margin-top:20px}
.sec h3{margin:0 0 8px;font-size:11px;font-weight:700;letter-spacing:.06em;color:var(--faint);display:flex;justify-content:space-between}

.item{border-radius:9px;cursor:pointer;transition:background .1s}
.item:hover{background:#F6F6F8}
.irow{display:flex;align-items:flex-start;gap:12px;padding:8px 8px}
.item .sw{flex:none;width:4px;align-self:stretch;border-radius:2px;min-height:18px}
.item .ck{flex:none;width:18px;height:18px;border-radius:5px;border:1.5px solid #B7B7BE;display:grid;place-items:center;margin-top:0;background:#fff;cursor:pointer}
.item .ck.on{background:var(--text);border-color:var(--text)}
.item.work .ck{border-color:var(--work)}
.item.acct .ck{border-color:var(--acct)}
.item.acct .ck.on{background:var(--acct);border-color:var(--acct)}
.item .ck svg{width:11px;height:11px;display:none}
.item .ck.on svg{display:block}
.item .body{min-width:0;flex:1}
.item .tt{font-size:14px;font-weight:400;line-height:18px;word-break:break-word;white-space:pre-wrap}
.item.isdone .tt{color:var(--gray);text-decoration:line-through;text-decoration-color:#C9C9CF}
.item .meta{font-size:12px;color:var(--faint);margin-top:4px}
.item .note{font-size:12px;color:var(--sub);margin-top:4px;white-space:pre-wrap;line-height:1.5;word-break:break-word;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:3;overflow:hidden}
.item .grip{flex:none;align-self:flex-start;display:flex;height:18px;align-items:center;color:#C4C4CA;opacity:0;cursor:grab;touch-action:none;padding:0 4px}
.item:hover .grip{opacity:1}
.item.dragging{position:relative;z-index:5;background:#fff;box-shadow:0 8px 24px rgba(0,0,0,.14);cursor:grabbing}
.item.open{background:rgba(0,0,0,.04);cursor:default;margin:4px 0}
.item.open .irow{align-items:center;padding-bottom:4px}
.ititle.imemo{resize:none;overflow:hidden;line-height:18px;padding:0;font-weight:400;white-space:pre-wrap;word-break:break-word;border-bottom:0 !important;display:block}
.ititle{flex:1;min-width:0;border:0;outline:0;background:transparent;font-size:14px;font-weight:400;padding:4px 0;border-bottom:1.5px solid var(--text);border-radius:0}
.opts{padding:8px 8px 12px 24px;display:flex;flex-direction:column;gap:8px}
.opts .seg button{height:24px;font-size:12px;padding:0 8px}
.opts .dbtn{height:28px;padding:0 8px;border:1px solid var(--line);border-radius:7px;background:#fff;font-size:12px;font-weight:600;letter-spacing:0;color:var(--sub);justify-content:flex-start;gap:4px}
.opts .dbtn svg{order:-1;color:currentColor}
.opts .dbtn:hover{border-color:var(--line2)}
.inote{width:100%;min-height:64px;border:0;outline:0;background:#fff;border-radius:8px;padding:8px 12px;font-size:12px;line-height:1.5;resize:vertical}
.ifoot{display:flex;justify-content:space-between}
.lnk{font-size:12px;font-weight:800;letter-spacing:.08em;color:var(--sub);padding:4px 0}
.lnk.del{color:var(--red)}

.panel.split{background:transparent;gap:16px;overflow:visible}
.pb.scratch{display:flex;flex-direction:column;background:var(--surface);border-radius:20px;flex:none}
.pb.scratch.todosec{flex:0 1 auto;max-height:60%;min-height:0}
.pb.scratch.memosec{flex:1 1 0;min-height:0}
.hact{display:flex;align-items:center;gap:4px}
.tlink.sm{height:24px;font-size:12px;padding:0 4px;letter-spacing:0;font-weight:600}
.rich{flex:1;min-height:0;overflow:auto;outline:0;margin-top:8px;font-size:14px;line-height:1.7;white-space:pre-wrap;word-break:break-word}
.rich hr{border:0;height:1px;background:rgba(0,0,0,.08);margin:16px 0}
.todoh{display:flex;justify-content:space-between;align-items:center;min-height:24px;font-size:12px;font-weight:800;letter-spacing:.08em}
.todoh.mh{margin-bottom:8px}
.tdlist{min-height:0}
.pb.scratch{padding:20px}
.tdadd{width:24px;height:24px;border-radius:6px;display:grid;place-items:center;color:var(--sub)}
.tdadd:hover{background:#EFEFF1;color:var(--text)}
.tdlist{overflow:auto;margin-top:4px}
.td{display:flex;align-items:center;gap:12px;padding:4px 0}
.td .ck{flex:none;width:18px;height:18px;border-radius:5px;border:1.5px solid #B7B7BE;display:grid;place-items:center;background:#fff;cursor:pointer}
.td .ck.on{background:var(--text);border-color:var(--text)}
.td .ck svg{width:11px;height:11px;display:none}
.td .ck.on svg{display:block}
.tdt{flex:1;min-width:0;border:0;outline:0;background:transparent;font-size:14px;font-weight:400;padding:4px 0}
.td.done .tdt{color:var(--gray);text-decoration:line-through;text-decoration-color:#C9C9CF}
.tdx{flex:none;width:20px;height:20px;border-radius:5px;color:var(--faint);opacity:0;font-size:15px;line-height:1}
.td:hover .tdx,.tdt:focus + .tdx{opacity:1}
.tdx:hover{color:var(--red)}

/* ---------- Review (평가) ---------- */
.review{display:none;flex:1;min-width:0;background:var(--surface);border-radius:20px;flex-direction:column;overflow:hidden}
body.mode-review .review{display:flex}
.review .rh{padding:28px 40px 0;font-size:13px;font-weight:700;color:var(--faint);letter-spacing:.02em}
.review .rh{display:flex;justify-content:space-between;align-items:center;min-height:56px}
.rbody{--rpt:16px;--rpx:40px;position:relative;flex:1;overflow:auto;outline:0;padding:var(--rpt) var(--rpx) 40px;font-size:15px;line-height:1.8;white-space:pre-wrap;word-break:break-word}
.rbody hr{border:0;height:1px;background:#000;margin:20px 0}
.review{position:relative}
.rtools{display:flex;gap:16px}
.rbody table{border-collapse:collapse;width:100%;table-layout:fixed;margin:12px 0}
.rbody td{border:1px solid #CFCFD4;padding:8px 12px;vertical-align:top;line-height:1.6;min-width:40px}
.rbody tr:first-child td{background:#F7F7F8;font-weight:700}
.rbody td.cur{box-shadow:inset 0 0 0 2px var(--text)}
.ttools{display:none;margin:0 auto 0 16px;gap:4px;background:#18181B;border-radius:8px;padding:4px;z-index:10;box-shadow:0 4px 14px rgba(0,0,0,.18)}
.ttools.show{display:flex}
.ttools button{color:#fff;font-size:12px;font-weight:600;padding:4px 8px;border-radius:6px;white-space:nowrap}
.ttools button:hover{background:#3A3A3F}
.ttools .del{color:#FF9B9B}
.ttools i{width:1px;background:#3A3A3F;margin:4px 4px}
/* 비어 있을 때 커서 높이를 한글 글꼴 기준으로 → 안내 문구와 세로 정렬 일치 */
.rbody:empty{font-family:"Apple SD Gothic Neo","Malgun Gothic",-apple-system,BlinkMacSystemFont,sans-serif}
.rbody:empty::before{content:"내용을 입력하세요";color:var(--faint);position:absolute;top:var(--rpt);left:var(--rpx);line-height:inherit;pointer-events:none}

/* ---------- Modal ---------- */
.modal{position:fixed;inset:0;background:rgba(20,20,24,.35);display:none;align-items:center;justify-content:center;z-index:50;padding:20px}
.modal.open{display:flex}
.sheet{background:#fff;border-radius:20px;width:520px;max-width:100%;max-height:88vh;overflow:auto;padding:24px;box-shadow:0 20px 60px rgba(0,0,0,.2)}
.sheet .shead{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.sheet h2{margin:0;font-size:16px;font-weight:800;letter-spacing:-.01em}
.sheet h4{margin:24px 0 8px;font-size:12px;font-weight:800;letter-spacing:.08em}
.sheet p.s{margin:0 0 8px;font-size:12px;font-weight:600;color:var(--sub);line-height:1.6}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}

<script>
/* =====================================================================
   HOLIDAY ENGINE — 대한민국 관공서 공휴일 (공휴일에 관한 법률 / 관공서의 공휴일에 관한 규정)
   - 음력 명절(설날·부처님오신날·추석) 양력일: 한국천문연구원 음양력 기준 2020–2050
   - 대체공휴일: 설·추석(일요일·타 공휴일 겹침), 국경일·어린이날·부처님오신날·성탄절·노동절(토·일·겹침)
   - 2026년부터 노동절(5/1)·제헌절(7/17) 공휴일
   ===================================================================== */
const LUNAR = {"2020":"0125,0430,1001","2021":"0212,0519,0921","2022":"0201,0508,0910","2023":"0122,0527,0929","2024":"0210,0515,0917","2025":"0129,0505,1006","2026":"0217,0524,0925","2027":"0207,0513,0915","2028":"0127,0502,1003","2029":"0213,0520,0922","2030":"0203,0509,0912","2031":"0123,0528,1001","2032":"0211,0516,0919","2033":"0131,0506,0908","2034":"0219,0525,0927","2035":"0208,0515,0916","2036":"0128,0503,1004","2037":"0215,0522,0924","2038":"0204,0511,0913","2039":"0124,0430,1002","2040":"0212,0518,0921","2041":"0201,0507,0910","2042":"0122,0526,0928","2043":"0210,0516,0917","2044":"0130,0505,1005","2045":"0217,0524,0925","2046":"0206,0513,0915","2047":"0126,0502,1004","2048":"0214,0520,0922","2049":"0202,0509,0911","2050":"0123,0528,0930"};
// 선거일·임시공휴일 (확정분). 이후 지정분은 Google 동기화 또는 '사용자 휴일'로 추가
const SPECIAL = {
  "2020-04-15":"국회의원선거","2020-08-17":"임시공휴일",
  "2022-03-09":"대통령선거","2022-06-01":"지방선거","2023-10-02":"임시공휴일",
  "2024-04-10":"국회의원선거","2024-10-01":"임시공휴일",
  "2025-01-27":"임시공휴일","2025-06-03":"대통령선거",
  "2026-06-03":"지방선거","2028-04-12":"국회의원선거"
};
const pad = n => String(n).padStart(2,'0');
const toS = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const toD = s => { const [y,m,d] = s.split('-').map(Number); return new Date(y, m-1, d); };
const addDays = (s,n) => { const d = toD(s); d.setDate(d.getDate()+n); return toS(d); };
const diffDays = (a,b) => Math.round((toD(b)-toD(a))/864e5);
const dowOf = s => toD(s).getDay();

function computeHolidays(y){
  const map = new Map(); // date -> [{name, rule}]  rule: none | wk(토·일·겹침) | lunar(일·겹침)
  const add = (s,name,rule) => { if(!map.has(s)) map.set(s,[]); map.get(s).push({name,rule}); };
  const natSub = y >= 2021 ? 'wk' : 'none';
  const relSub = y >= 2023 ? 'wk' : 'none';
  add(`${y}-01-01`,'신정','none');
  add(`${y}-03-01`,'삼일절', y>=2022 ? 'wk' : 'none');

  for (const [s,list] of map) out.set(s, [...new Set(list.map(h=>h.name))]);

      for (let c=c0; c<=c1; c++) for (const [, bt] of occ[c]) cand.push(bt);
      cand.sort((x,y)=>x-y);
      let top = 0;
      for (const t of cand){
        let ok = true;
        for (let c=c0; c<=c1 && ok; c++) for (const [a, bt] of occ[c]) if (t < bt && t + h > a){ ok = false; break; }
        if (ok){ top = t; break; }
      }
      b.style.top = top + 'px';
      for (let c=c0; c<=c1; c++){ occ[c].push([top, top + h]); bottoms[c] = Math.max(bottoms[c], top + h); }
    }
    const h = Math.max(0, ...bottoms);
    bars.style.height = h + 'px';
    // 칸 높이 고정: 넘치는 칸은 마지막 줄 자리에 '+N' (가려진 일정 수) 표시 — 눌러서 전체 확인
    const avail = w.clientHeight - headH - 2, cells = w.querySelectorAll('.cell'), line = cssPx('--bar-h') + gap;
    bottoms.forEach((bt,c) => {
      const cell = cells[c]; if (!cell) return;
      cell.querySelector('.moren')?.remove();
      if (bt - gap <= avail) return;
      const limit = Math.max(0, avail - line);
      const hid = occ[c].filter(([t, b2]) => b2 - gap > limit);   // 마지막 줄 아래로 걸치는 일정
      const top = Math.min(...hid.map(([t]) => t));                // 걸친 일정의 윗선부터 덮어서 잘린 막대가 안 보이게
      cell.insertAdjacentHTML('beforeend', `<div class="moren" style="top:${headH + top}px;padding-top:${Math.max(0, limit - top)}px">+${hid.length}</div>`);
    });
  });
}

  requestAnimationFrame(() => {

    const box = a.isContentEditable ? a : (a.closest('.pb') || a);
    let r = null;

  });

  sel={a,b}; expId=null; ctype='work';   // 날짜를 새로 고르면 유형은 항상 [업무]로
  render(); $('#panel').classList.add('open');

}
function revealSel(){
  setTimeout(()=>{
    const c = document.querySelector('.cell.insel'); if (!c) return;
    const w = $('#weeks'), r = c.getBoundingClientRect(), top = w.getBoundingClientRect().top + 4;
    const limit = innerHeight - $('#panel').getBoundingClientRect().height - 8;
    if (r.bottom > limit || r.top < top) w.scrollBy({top: r.bottom > limit ? Math.max(r.bottom - limit, r.top - top) : r.top - top, behavior:'smooth'});
  }, 240);
}
function goMonth(y,m){
  view={y:y+Math.floor(m/12), m:((m%12)+12)%12};
  render(); $('#weeks').scrollTop = 0;
}
function setMode(mo){
  curTd = null; $('#ttools').classList.remove('show');

  mode = mo; render();

let toastTimer;
function toast(msg, act, fn){
  if (isMobile()) msg = msg.replace(/ · ⌘Z 되돌리기$/, '');
  const el=$('#toast'); $('#toastMsg').textContent=msg; const b=$('#toastAct');
  b.textContent=act||''; b.style.display=act?'':'none'; b.onclick=()=>{ fn&&fn(); el.classList.remove('show'); };
  el.classList.add('show'); clearTimeout(toastTimer); toastTimer=setTimeout(()=>el.classList.remove('show'), act?5000:2200);
}

/* ---------- events: grid (클릭·드래그 선택 / 바 이동·순서 변경·기간 조절) ---------- */
let drag = null;
const dateAt = (x,y) => { const el = document.elementsFromPoint(x,y).find(n => n.classList && n.classList.contains('cell')); return el ? el.dataset.date : null; };
$('#weeks').addEventListener('pointerdown', ev => {
  if (ev.button!==0) return;
  const bar = ev.target.closest('.bar');
  const d = dateAt(ev.clientX, ev.clientY);
  if (bar){
    const e = state.events.find(x=>x.id===bar.dataset.id); if(!e) return;
    ev.preventDefault();
    const r = bar.getBoundingClientRect();
    drag = {kind:'bar', id:e.id, mode: ev.target.classList.contains('rz')?'resize':'move', origin:d, start:e.start, end:e.end,
      sx:ev.clientX, sy:ev.clientY, gx:ev.clientX-r.left, gy:ev.clientY-r.top, bar, on:false, touch: ev.pointerType==='touch'};
    if (drag.touch) drag.timer = setTimeout(()=>{ if (drag && drag.kind==='bar') startBarDrag(drag); }, 190);
  } else if (d){
    drag = {kind:'sel', anchor:d, cur:d, touch: ev.pointerType==='touch', x:ev.clientX, y:ev.clientY, mode:'pending'};
    if (!drag.touch){ commitDraft(); sel={a:d,b:d}; paintSel(); }   // 쓰던 내용은 원래 선택했던 날짜로 먼저 등록
    else drag.timer = setTimeout(() => {   // 터치: 길게 누르면 범위 선택 시작 → 드래그로 여러 날짜
      if (drag && drag.kind==='sel' && drag.mode==='pending'){ drag.mode='range'; commitDraft(); sel={a:d,b:d}; paintSel(); navigator.vibrate?.(10); }
    }, 175);
  }
});
/* 터치로 팝업을 연 직후 같은 손가락의 클릭이 팝업/배경에 떨어져 바로 닫히는 것 방지 */
let ghostUntil = 0;
document.addEventListener('click', ev => { if (Date.now() < ghostUntil){ ghostUntil = 0; ev.stopPropagation(); ev.preventDefault(); } }, true);
/* 좌우 스와이프로 달 이동 (모바일) */
function finishSwipe(dx){
  const w = $('#weeks');
  if (Math.abs(dx) < 50){ w.classList.add('slide'); w.style.transform=''; w.style.opacity=''; return; }
  const dir = dx < 0 ? 1 : -1;
  goMonth(view.y, view.m + dir);
  w.classList.remove('slide'); w.style.transform = `translateX(${dir*24}px)`; w.style.opacity = '.6'; void w.offsetWidth;
  w.classList.add('slide'); w.style.transform = ''; w.style.opacity = '';
}
window.addEventListener('pointercancel', () => {
  if (!drag) return;
  clearTimeout(drag.timer);
  if (drag.kind==='sel' && drag.mode==='swipe'){ const w=$('#weeks'); w.classList.add('slide'); w.style.transform=''; w.style.opacity=''; }
  if (drag.kind==='bar'){ document.body.classList.remove('bardrag'); clearDropMarks(); drag.ghost?.remove(); preview=null; render(); }
  drag = null;
});
$('#weeks').addEventListener('touchmove', ev => { if (drag && ((drag.kind==='sel' && (drag.mode==='range'||drag.mode==='swipe')) || (drag.kind==='bar' && drag.on))) ev.preventDefault(); }, {passive:false});
/* 날짜가 선택(앵커링)된 동안 좌측 캘린더 모듈에 검정 1px 테두리 */
function outlineSel(){ $('.cal').classList.toggle('anchored', !!sel); }
function selEdges(){   // 연속 선택 구간의 양 끝에만 둥근 모서리
  document.querySelectorAll('.cells').forEach(row => { const cs=[...row.children];
    cs.forEach((c,i) => { const on=c.classList.contains('insel'); c.classList.toggle('sl', on && !(cs[i-1]?.classList.contains('insel'))); c.classList.toggle('sr', on && !(cs[i+1]?.classList.contains('insel'))); }); });
}
function paintSel(){
  const [a,b] = sel.a<=sel.b?[sel.a,sel.b]:[sel.b,sel.a];
  document.querySelectorAll('.cell').forEach(c => { const s=c.dataset.date; c.classList.toggle('insel', s>=a&&s<=b); });
  selEdges();
  outlineSel();
}
function startBarDrag(g){
  g.on = true;
  document.body.classList.add('bardrag');
  document.querySelectorAll(`.bar[data-id="${g.id}"]`).forEach(b => b.classList.add('dragging'));
  if (g.mode==='move'){
    const r = g.bar.getBoundingClientRect();
    const gh = g.bar.cloneNode(true);
    gh.classList.add('ghost'); gh.classList.remove('dragging','cl','cr');
    Object.assign(gh.style, {width: Math.min(r.width, 240)+'px', left:(g.sx-g.gx)+'px', top:(g.sy-g.gy)+'px', right:'auto'});
    document.body.appendChild(gh); g.ghost = gh;
  }
}
function clearDropMarks(){ document.querySelectorAll('.cell.drop').forEach(c=>c.classList.remove('drop')); }
window.addEventListener('pointermove', ev => {
  if (!drag) return;
  if (drag.kind==='sel'){
    if (drag.touch){
      const dx = ev.clientX-drag.x, dy = ev.clientY-drag.y;
      if (drag.mode==='pending'){
        if (Math.hypot(dx,dy) < 10) return;
        clearTimeout(drag.timer);
        if (Math.abs(dx) > Math.abs(dy)) drag.mode = 'swipe'; else { drag = null; return; }   // 세로면 스크롤
      }
      if (drag.mode==='swipe'){ ev.preventDefault(); drag.dx = dx; const w=$('#weeks'); w.classList.remove('slide'); w.style.transform=`translateX(${dx*0.2}px)`; return; }
      if (drag.mode==='range'){ ev.preventDefault(); const d = dateAt(ev.clientX, ev.clientY); if (d && d!==drag.cur){ drag.cur=d; sel={a:drag.anchor,b:d}; paintSel(); } }
      return;
    }
    const d = dateAt(ev.clientX, ev.clientY); if (!d) return;
    if (d!==drag.cur){ drag.cur=d; sel={a:drag.anchor,b:d}; paintSel(); } return;
  }
  const g = drag;
  if (!g.on){
    if (Math.hypot(ev.clientX-g.sx, ev.clientY-g.sy) < (g.touch?10:4)) return;
    if (g.touch){ clearTimeout(g.timer); const dx=ev.clientX-g.sx, dy=ev.clientY-g.sy; drag = Math.abs(dx)>Math.abs(dy) ? {kind:'sel', touch:true, mode:'swipe', x:g.sx, y:g.sy} : null; return; } // 롱프레스 전에 움직이면 스와이프/스크롤
    startBarDrag(g);
  }
  ev.preventDefault();
  const d = dateAt(ev.clientX, ev.clientY);
  if (g.mode==='move'){
    g.ghost.style.left = (ev.clientX-g.gx)+'px'; g.ghost.style.top = (ev.clientY-g.gy)+'px';
    clearDropMarks();
    if (d){ const delta = diffDays(g.origin, d); for (let x=addDays(g.start,delta); x<=addDays(g.end,delta); x=addDays(x,1)) document.querySelectorAll(`.cell[data-date="${x}"]`).forEach(c=>c.classList.add('drop')); }
    return;
  }
  if (!d) return;
  let e = addDays(g.end, diffDays(g.origin, d)); if (e<g.start) e=g.start;
  if (!preview || preview.end!==e){ preview={id:g.id,start:g.start,end:e}; renderGrid(); }
}, {passive:false});
window.addEventListener('pointerup', ev => {
  if (!drag) return; const g = drag; drag = null;
  if (g.kind==='sel'){
    if (g.touch){
      clearTimeout(g.timer);
      if (g.mode==='swipe') return finishSwipe(g.dx||0);
      if (g.mode==='range'){ const a = g.anchor<=g.cur?g.anchor:g.cur, b = g.anchor<=g.cur?g.cur:g.anchor; ghostUntil = Date.now()+500; selectRange(a,b); return; }
      const d=dateAt(ev.clientX,ev.clientY); if (d && Math.hypot(ev.clientX-g.x, ev.clientY-g.y)<10){ ghostUntil = Date.now()+500; selectRange(d,d); } return;
    }
    const a = g.anchor<=g.cur?g.anchor:g.cur, b = g.anchor<=g.cur?g.cur:g.anchor;
    selectRange(a,b); return;
  }
  clearTimeout(g.timer);
  document.body.classList.remove('bardrag'); clearDropMarks();
  g.ghost?.remove();
  if (!g.on){ preview=null; if (g.origin){ if (g.touch) ghostUntil = Date.now()+500; selectRange(g.origin, g.origin); } else openItem(g.id, g.origin); return; }
  const ev0 = state.events.find(x=>x.id===g.id); if (!ev0){ render(); return; }
  if (g.mode==='resize'){
    const p = preview; preview=null;
    if (p && p.end!==g.end){ updateEvent(g.id,{end:p.end},true); toast(`기간 변경: ${fmtMD(p.start)} – ${fmtMD(p.end)}`); } else render();
    return;
  }
  const d = dateAt(ev.clientX, ev.clientY);
  const delta = d && g.origin ? diffDays(g.origin, d) : 0;
  const patch = {start:addDays(g.start,delta), end:addDays(g.end,delta)};
  // 순서: 놓은 위치 아래/위의 다른 일정 기준으로 끼워 넣기
  const grp = multi(ev0);
  const target = document.elementsFromPoint(ev.clientX, ev.clientY).find(n => n.classList?.contains('bar') && !n.classList.contains('ghost') && n.dataset.id!==g.id);
  if (d){
    const day = state.events.filter(e => e.id!==g.id && e.start<=d && e.end>=d && multi(e)===grp).sort(dayOrder);
    let pos = -1;
    if (target){
      const ti = day.findIndex(e => e.id===target.dataset.id);
      if (ti>=0){ const r = target.getBoundingClientRect(); pos = ev.clientY < r.top + r.height/2 ? ti : ti+1; }
    } else if (day.length){
      const cellBars = [...document.querySelectorAll('.bar')].filter(b => day.some(e=>e.id===b.dataset.id) && b.closest('.week')===document.elementsFromPoint(ev.clientX,ev.clientY).find(n=>n.classList?.contains('week')));
      const bottom = Math.max(0, ...cellBars.map(b=>b.getBoundingClientRect().bottom));
      if (bottom && ev.clientY > bottom) pos = day.length;
    }
    if (pos>=0){
      const prev = day[pos-1], next = day[pos];
      patch.order = prev && next ? (ord(prev)+ord(next))/2 : prev ? ord(prev)+1 : next ? ord(next)-1 : ord(ev0);
    }
  }
  const moved = patch.start!==ev0.start, reordered = patch.order!==undefined && patch.order!==ord(ev0);
  if (!moved && !reordered){ render(); return; }
  updateEvent(g.id, patch, true);
  if (moved) toast(`${fmtMD(patch.start)}${patch.start!==patch.end?' – '+fmtMD(patch.end):''}로 이동`);
});

/* ---------- 날짜 선택 팝업 (브라우저 기본 달력 대신) ---------- */
let dp = null;   // {id, val, m(YYYY-MM-01), btn}
function openDP(btn){ dp = {id:btn.dataset.dp, val:btn.dataset.val, m:btn.dataset.val.slice(0,8)+'01', btn}; renderDP(); }
function closeDP(){ dp = null; $('#dp').classList.remove('show'); }
function renderDP(){
  if (!dp) return;
  const el = $('#dp'), first = dp.m, y = +first.slice(0,4), m = +first.slice(5,7)-1, last = monthLast(y,m);
  let d = addDays(first, -((dowOf(first)+6)%7));
  let cells = '';
  ['월','화','수','목','금','토','일'].forEach(w => cells += `<span class="dw">${w}</span>`);
  while (d <= last || dowOf(d)!==1){
    const w = dowOf(d), info = dayInfo(d);
    const cls = [d<first||d>last?'out':'', (w===0||w===6)?'we':'', info.hol?'hol':'', d===TODAY?'today':'', d===dp.val?'sel':''].join(' ');
    cells += `<button type="button" class="${cls}" data-d="${d}">${+d.slice(8)}</button>`;
    d = addDays(d,1);
  }
  el.innerHTML = `<div class="dph"><b>${y}년 ${m+1}월</b><span class="nav">
    <button type="button" data-mv="-1"><svg width="14" height="14" viewBox="0 0 16 16"><path d="M10 3L5 8l5 5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
    <button type="button" data-mv="1"><svg width="14" height="14" viewBox="0 0 16 16"><path d="M6 3l5 5-5 5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></button></span></div>
    <div class="dpg">${cells}</div>`;
  el.classList.add('show');
  const r = dp.btn.getBoundingClientRect(), w = el.offsetWidth, h = el.offsetHeight;
  let top = r.bottom + 8; if (top + h > innerHeight - 8) top = r.top - h - 8;
  el.style.left = Math.max(8, Math.min(r.left, innerWidth - w - 8)) + 'px';
  el.style.top = Math.max(8, top) + 'px';
}
$('#dp').addEventListener('click', ev => {
  const mv = ev.target.closest('[data-mv]');
  if (mv){ const y=+dp.m.slice(0,4), m=+dp.m.slice(5,7)-1+(+mv.dataset.mv); dp.m = monthFirst(y+Math.floor(m/12), (m%12+12)%12); renderDP(); return; }
  const b = ev.target.closest('[data-d]'); if (!b) return;
  const d = b.dataset.d, id = dp.id, btn = dp.btn; closeDP();
  if (id==='cuD'){ btn.dataset.val = d; btn.querySelector('[data-dv]').textContent = fmtShort(d); return; }
  const e = state.events.find(x=>x.id===expId); if (!e) return;
  let a = e.start, z = e.end;
  if (id==='iA'){ a = d; if (z<a) z = a; } else { z = d; if (z<a) a = z; }
  updateEvent(expId, {start:a, end:z}, true);
});
document.addEventListener('pointerdown', ev => { if (dp && !ev.target.closest('#dp') && !ev.target.closest('[data-dp]')) closeDP(); }, true);
window.addEventListener('resize', closeDP);

   한 번 쓸 때 한 달. 관성 스크롤은 무시하고, 새로 쓸기 시작하면(멈춤 또는 가속 감지) 다시 이동 */
let wAcc = 0, wLocked = false, wLockUntil = 0, wLast = 0, wLastT = 0;
/* PC: 휠·트랙패드로 달 이동 기능 제거 (캘린더 스크롤과 충돌) — 달 이동은 상단 월 칩 / 연도 화살표로 */

/* ---------- events: panel ---------- */
let rdrag = null, suppressClick = false;
$('#panel').addEventListener('paste', ev => { if (ev.target.closest?.('#scratchBody')) richPaste(ev); });
$('#panel').addEventListener('mousedown', ev => { if (ev.target.closest('#memoHr')) ev.preventDefault(); });
$('#panel').addEventListener('pointerdown', ev => {
  if (ev.button!==0) return;
  const it = ev.target.closest('.list .item'); if (!it) return;
  if (ev.target.closest('.ck,input,textarea,button,label,.opts')) return;
  if (ev.pointerType==='touch' && !ev.target.closest('.grip')) return;
  const r = it.getBoundingClientRect();
  rdrag = {it, list:it.parentElement, y0:ev.clientY, grab:ev.clientY-r.top, on:false};
  if (ev.target.closest('.grip')) ev.preventDefault();
});
window.addEventListener('pointermove', ev => {
  if (!rdrag) return;
  const g = rdrag;
  if (!g.on){ if (Math.abs(ev.clientY-g.y0) < 5) return; g.on = true; g.it.classList.add('dragging'); document.body.style.userSelect='none'; }
  g.it.style.transform = '';
  const prev = g.it.previousElementSibling, next = g.it.nextElementSibling;
  if (prev && prev.classList.contains('item')){ const r=prev.getBoundingClientRect(); if (ev.clientY < r.top + r.height/2) g.list.insertBefore(g.it, prev); }
  if (next && next.classList.contains('item')){ const r=next.getBoundingClientRect(); if (ev.clientY > r.top + r.height/2) g.list.insertBefore(next, g.it); }
  const top = g.it.getBoundingClientRect().top;
  g.it.style.transform = `translateY(${ev.clientY - g.grab - top}px)`;
});
window.addEventListener('pointerup', () => {
  if (!rdrag) return; const g = rdrag; rdrag = null;
  if (!g.on) return;
  suppressClick = true; setTimeout(()=>suppressClick=false, 50);
  document.body.style.userSelect='';
  const ids = [...g.list.querySelectorAll('.item')].map(x=>x.dataset.id);
  const all = ids.map(id => state.events.find(e=>e.id===id)).filter(Boolean);
  checkpoint();
  for (const grp of [0,1]){   // 하루짜리 / 여러 날 일정은 각각의 묶음 안에서 순서 변경
    const evs = all.filter(e => multi(e)===grp), slots = evs.map(ord).sort((x,y)=>x-y);
    evs.forEach((e,i) => e.order = slots[i] + (i && slots[i]<=slots[i-1] ? i*1e-3 : 0));
  }
  save(); render();
});
$('#panel').addEventListener('click', ev => {
  if (suppressClick){ suppressClick=false; return; }
  const t = ev.target;
  if (t.closest('#addBar')){ openComposer(); return; }
  if (t.closest('#allDone')){   // 선택한 날짜(기간)의 업무·회계 일정 모두 완료 / 모두 완료면 취소
    const [a,b] = sel.a<=sel.b ? [sel.a,sel.b] : [sel.b,sel.a];
    const tasks = state.events.filter(e => e.start<=b && e.end>=a && isTask(e)); if (!tasks.length) return;
    const to = !tasks.every(e => e.done); checkpoint(); tasks.forEach(e => e.done = to); save(); render();
    toast(to ? `${tasks.length}개 일정 완료` : '완료 취소'); return;
  }
  if (t.closest('#closePanel')){ if (sel) deselectAll(); else $('#panel').classList.remove('open'); return; }
  const tog = t.closest('[data-tog]'); if (tog){ toggleDone(tog.dataset.tog); return; }
  const ct = t.closest('[data-ct]'); if (ct){ ctype=ct.dataset.ct; document.querySelectorAll('.tchip').forEach(x=>x.classList.toggle('on',x.dataset.ct===ctype)); $('#cText').focus(); return; }
  if (t.closest('#cAdd')){ addFromComposer(); return; }
  if (t.closest('#tdAdd')){ addTodo(); return; }
  if (t.closest('#memoHr')){ insertHrIn($('#scratchBody'), saveScratch); return; }
  const tdr = t.closest('[data-td]');
  if (tdr && t.closest('[data-tdtog]')){ const x=todos().find(z=>z.id===tdr.dataset.td); if(x){ checkpoint(); x.done=!x.done; save(); renderPanel(); } return; }
  if (tdr && t.closest('[data-tddel]')){ const l=todos(), i=l.findIndex(z=>z.id===tdr.dataset.td); if(i>=0){ checkpoint(); l.splice(i,1); save(); renderPanel(); } return; }
  if (t.closest('#iDel')){ deleteEvent(expId); return; }
  if (t.closest('#iClose')){ expId=null; renderPanel(); return; }
  const ty = t.closest('#iType button'); if (ty){ const patch={type:ty.dataset.v}; if (!['work','acct'].includes(patch.type)) patch.done=false; updateEvent(expId,patch,true); return; }
  const dn = t.closest('#iDone button'); if (dn){ updateEvent(expId,{done:dn.dataset.v==='1'},true); return; }
  const dpb = t.closest('[data-dp]'); if (dpb){ if (dp && dp.btn===dpb) closeDP(); else openDP(dpb); return; }
  const it = t.closest('.item[data-id]');
  if (it && it.dataset.id!==expId){ expId = it.dataset.id; renderPanel(); focusTitle(); return; }
});
$('#panel').addEventListener('input', ev => {
  const id = ev.target.id;
  if (id==='cText'){ draft = ev.target.value; $('#cAdd').disabled = !draft.trim(); return; }
  if (id==='scratchBody'){ saveScratch(); return; }
  if (ev.target.classList.contains('tdt')){ const x=todos().find(z=>z.id===ev.target.closest('[data-td]').dataset.td); if(x){ typingCheckpoint('td'+x.id); x.text=ev.target.value; save(); } return; }
  if (id==='iTitle'){ typingCheckpoint('t'+expId); updateEvent(expId,{title:ev.target.value},false,true); }
  if (id==='iMemo'){ typingCheckpoint('m'+expId); fitMemo(); const [first,...rest]=ev.target.value.split('\n'); updateEvent(expId,{title:first, note:rest.join('\n')},false,true); }
});
$('#panel').addEventListener('change', ev => {
  const id = ev.target.id;
  if (id==='cA'||id==='cB'){ let a=$('#cA').value, b=$('#cB').value; if(!a) return; if(!b||b<a){ b=a; $('#cB').value=a; } sel={a,b}; $('#cBd').textContent=`영업일 ${bizDays(a,b)}일`; $('[data-dv=cA]').textContent=fmtShort(a); $('[data-dv=cB]').textContent=fmtShort(b); renderGrid(); }
  if (id==='iA'||id==='iB'){ let a=$('#iA').value, b=$('#iB').value; if(!a) return; if(!b||b<a) b=a; updateEvent(expId,{start:a,end:b},true); }
});
$('#panel').addEventListener('keydown', ev => {
  if (ev.target.id==='iTitle' && ev.key==='Enter' && !ev.isComposing){ ev.preventDefault(); ev.target.blur(); }
  if (ev.target.id==='scratchBody') richKeydown(ev, ev.target, saveScratch);
  if (ev.target.id==='cText' && ev.key==='Enter' && !ev.shiftKey && !ev.isComposing && ev.keyCode!==229){ ev.preventDefault(); if (!isMobile()) addFromComposer(); else { draft = ev.target.value; addFromComposer(); } }
  if (ev.target.classList.contains('tdt') && ev.key==='Enter' && !ev.isComposing){ ev.preventDefault(); if (ev.target.value.trim()) addTodo(ev.target.closest('[data-td]').dataset.td); }
});
function deselectAll(){ document.body.classList.remove('composing','kb'); commitDraft(); expId=null; sel=null; document.activeElement?.blur?.(); $('#panel').classList.remove('open'); render(); }
/* 편집 중인 일정 바깥을 누르면 저장된 채로 편집 종료 / 캘린더 바깥 회색 배경을 누르면 선택 해제(Esc와 동일) */
document.addEventListener('pointerdown', ev => {
  if (ev.button!==0 || mode!=='cal' || $('#modal').classList.contains('open')) return;
  const t = ev.target;
  if (t.closest('.toast') || t.closest('#dp')) return;
  const bg = t===document.body || t===document.documentElement || t.matches('#app, main, .topbar, .spacer, .title');
  if (bg && sel){ deselectAll(); return; }
  if (expId && !t.closest('.item.open')){
    const el = $('.item.open'), e = state.events.find(x=>x.id===expId);
    expId = null;
    if (el && e) el.outerHTML = itemHTML(e);
  }
}, true);
document.addEventListener('keydown', ev => {
  const tag = (ev.target.tagName||'').toLowerCase(), typing = tag==='input'||tag==='textarea'||ev.target.isContentEditable;
  if (ev.key==='Escape'){
    if (dp) return closeDP();
    if (ctxId) return hideCtx();
    if ($('#modal').classList.contains('open')) return closeModal();
    if (mode==='review') return;
    if (expId){ expId=null; document.activeElement?.blur?.(); renderPanel(); return; }
    deselectAll(); return;
  }
  const mod = ev.metaKey || ev.ctrlKey, k = (ev.key||'').toLowerCase();
  const fieldHasText = typing && (ev.target.isContentEditable || ev.target.value !== '');   // 메모·평가 같은 서식 입력칸은 항상 브라우저 기본 되돌리기   // 입력 중인 칸은 브라우저 기본 되돌리기 사용
  if (mod && mode==='cal' && !fieldHasText){
    if (k==='z' && !ev.shiftKey){ ev.preventDefault(); undo(); return; }
    if (k==='y' || (k==='z' && ev.shiftKey)){ ev.preventDefault(); redo(); return; }
  }
  if (typing || ev.metaKey || ev.ctrlKey || mode!=='cal') return;
  if (ev.key==='ArrowLeft') goMonth(view.y, view.m-1);
  if (ev.key==='ArrowRight') goMonth(view.y, view.m+1);
  if (ev.key==='t'||ev.key==='T') $('#todayBtn').click();
  if (ev.key==='n'||ev.key==='N'){ ev.preventDefault(); if(!sel) selectRange(TODAY,TODAY); $('#panel').classList.add('open'); $('#cText')?.focus(); }
});
window.addEventListener('resize', () => { clearTimeout(window._rz); window._rz=setTimeout(render,120); });

/* ---------- settings ---------- */
function openSettings(){ renderSettings(); $('#modal').classList.add('open'); }
function closeModal(){ $('#modal').classList.remove('open'); }
$('#modal').addEventListener('click', ev => { if (ev.target.id==='modal') closeModal(); });
function renderSettings(confirmImport){
  const S = state.settings;
  const y = view.y;
  const hol = [];
  for (let d=`${y}-01-01`; d<=`${y}-12-31`; d=addDays(d,1)){ const i=dayInfo(d); if (i.names.length) hol.push([d,i.names.join(' · ')]); }
  const syncInfo = state.synced ? `마지막 동기화: ${new Date(state.synced.at).toLocaleString('ko-KR')} · ${Object.keys(state.synced.days).length}일` : '동기화 기록 없음';
  $('#sheet').innerHTML = `
    <div class="shead"><h2>설정</h2><button class="iconbtn" id="sClose">✕</button></div>
    <h4>기기 간 동기화</h4>
    <div id="syncBox">${Sync.boxHTML()}</div>

    <h4>보기</h4>
    <div class="toggle"><span>완료 항목 숨기기</span><button class="sw2 ${S.hideDone?'on':''}" id="sHd"></button></div>

    <h4>공휴일 · ${y}년 (${hol.length}일)</h4>
    <p class="s">내장 데이터: 공휴일법·관공서 공휴일 규정 기준 규칙 + 한국천문연구원 음력 (2020–2050년). 2026년부터 노동절·제헌절 및 대체공휴일 반영. 이후 새로 지정되는 임시공휴일·선거일은 아래 Google 동기화나 사용자 휴일로 추가하세요.</p>
    <div class="hlist">${hol.map(([d,n])=>`<div><span>${fmtMD(d)}</span><span>${esc(n)}</span></div>`).join('')}</div>

    <h4>Google 공휴일 캘린더 동기화 (선택)</h4>
    <p class="s">Google Calendar API 키를 넣으면 Google의 대한민국 공휴일 캘린더에서 임시공휴일 등을 받아와 합칩니다. ${syncInfo}</p>
    <div class="row" style="margin-top:8px"><input type="password" id="sKey" placeholder="Google API Key" value="${esc(S.gcalKey)}"><button class="btn" id="sSync">동기화</button></div>

    <h4>사용자 휴일 (회사 휴무일·임시공휴일 등)</h4>
    <div class="row">${dateBtn('cuD', TODAY)}<input type="text" id="cuN" placeholder="이름 (예: 회사 창립기념일)"><button class="btn ghost" id="cuAdd">추가</button></div>
    ${state.customHolidays.length?`<div class="hlist">${state.customHolidays.slice().sort((a,b)=>a.date<b.date?-1:1).map(h=>`<div><span>${fmtMD(h.date)}</span><span style="margin-left:auto;margin-right:12px">${esc(h.name)}</span><button class="x" data-cudel="${h.date}|${esc(h.name)}">삭제</button></div>`).join('')}</div>`:''}

    <h4>데이터 백업</h4>
    <p class="s">데이터는 이 기기에 자동 저장돼요${Sync.on()?' (로그인하면 서버에도 저장)':''}. 기기 변경·브라우저 초기화에 대비해 가끔 백업해 두세요. (일정 ${state.events.length}개 · 버전 1116-1542)</p>
    <div class="row" style="margin-top:8px"><button class="btn ghost" id="exFile">파일로 내보내기</button><button class="btn ghost" id="exCopy">JSON 복사</button><label class="btn ghost" style="display:grid;place-items:center">파일 불러오기<input type="file" id="imFile" accept=".json,application/json" hidden></label></div>
    <textarea class="io" id="imText" placeholder="백업 JSON을 붙여넣고 '붙여넣기로 불러오기'"></textarea>
    <div class="row" style="margin-top:8px;justify-content:space-between"><button class="btn ghost" id="imPaste">${confirmImport?'정말 덮어쓸까요? 한 번 더 클릭':'붙여넣기로 불러오기'}</button><button class="btn danger" id="wipe">전체 삭제</button></div>`;
}
let wipeArm = false;
$('#sheet').addEventListener('click', async ev => {
  const t = ev.target, S = state.settings;
  if (t.closest('#sClose')) return closeModal();
  if (t.closest('#sbLogin') || t.closest('#sbSignup')){
    const em=$('#sbEmail').value.trim(), pw=$('#sbPw').value; if(!em||pw.length<6) return toast('이메일과 6자 이상 비밀번호를 입력해 주세요');
    const b=t.closest('button'); b.disabled=true;
    try { await Sync.login(em, pw, !!t.closest('#sbSignup')); toast('로그인했어요 · 동기화 시작'); }
    catch(e){ b.disabled=false; toast('로그인 실패 — '+e.message); }
    return;
  }
  if (t.closest('#sbNow')){ await Sync.pull(); return; }
  if (t.closest('#sbOut')){ Sync.logout(); return; }
  if (t.closest('#sHd')){ S.hideDone=!S.hideDone; save(); renderSettings(); render(); return; }
  if (t.closest('#sSync')){ S.gcalKey=$('#sKey').value.trim(); save(); return syncGoogle(); }
  const dpb = t.closest('[data-dp]'); if (dpb){ if (dp && dp.btn===dpb) closeDP(); else openDP(dpb); return; }
  if (t.closest('#cuAdd')){ const d=$('[data-dp=cuD]').dataset.val, n=$('#cuN').value.trim()||'휴무'; if(!d) return; state.customHolidays.push({date:d,name:n}); save(); renderSettings(); render(); return; }
  const cd = t.closest('[data-cudel]'); if (cd){ const [d,n]=cd.dataset.cudel.split('|'); state.customHolidays=state.customHolidays.filter(h=>!(h.date===d&&h.name===n)); save(); renderSettings(); render(); return; }
  if (t.closest('#exFile')){
    try { const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}); const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=`planner-backup-${TODAY}.json`; document.body.appendChild(a); a.click(); a.remove(); toast('백업 파일을 내보냈어요'); } catch(e){ toast('이 환경에선 파일 저장이 막혀 있어요. JSON 복사를 이용하세요'); }
    return;
  }
  if (t.closest('#exCopy')){ try { await navigator.clipboard.writeText(JSON.stringify(state)); toast('백업 JSON을 복사했어요'); } catch(e){ $('#imText').value=JSON.stringify(state); $('#imText').select(); toast('아래 칸의 내용을 직접 복사하세요'); } return; }
  if (t.closest('#imPaste')){
    let data; try { data=JSON.parse($('#imText').value); } catch(e){ return toast('JSON 형식이 올바르지 않아요'); }
    if (!Array.isArray(data.events)) return toast('백업 데이터가 아니에요');
    if (!t.closest('#imPaste').textContent.includes('정말')){ const txt=$('#imText').value; renderSettings(true); $('#imText').value=txt; return; }
    applyImport(data); return;
  }
  if (t.closest('#wipe')){ if(!wipeArm){ wipeArm=true; t.closest('#wipe').textContent='정말 전부 삭제? 한 번 더 클릭'; setTimeout(()=>{wipeArm=false;},4000); return; } wipeArm=false; state.events=[]; save(); renderSettings(); render(); toast('모든 일정을 삭제했어요'); }
});
$('#sheet').addEventListener('change', ev => {
  if (ev.target.id==='imFile'){ const f=ev.target.files[0]; if(!f) return; f.text().then(txt=>{ $('#imText').value=txt; renderSettings(true); $('#imText').value=txt; toast('내용을 확인하고 "정말 덮어쓸까요?"를 눌러 주세요'); }); }
});
function applyImport(data){
  const d = defaults();
  state = {...d, ...data, settings:{...d.settings, ...(data.settings||{})}};
  save(); renderSettings(); render(); toast(`불러오기 완료 · 일정 ${state.events.length}개`);
}
async function syncGoogle(){
  const key = state.settings.gcalKey; if (!key) return toast('API 키를 입력해 주세요');
  const cal = encodeURIComponent('ko.south_korea.official#holiday@group.v.calendar.google.com');
  const y = new Date().getFullYear();
  const url = `https://www.googleapis.com/calendar/v3/calendars/${cal}/events?key=${encodeURIComponent(key)}&timeMin=${y-1}-01-01T00:00:00Z&timeMax=${y+4}-01-01T00:00:00Z&singleEvents=true&maxResults=2500&hl=ko`;
  try {
    const r = await fetch(url); if (!r.ok) throw new Error('HTTP '+r.status);
    const j = await r.json(); const days = {};
    for (const it of j.items||[]){ const s=it.start?.date; if(!s) continue; const e=it.end?.date||addDays(s,1);
      for (let d=s; d<e; d=addDays(d,1)) (days[d]=days[d]||[]).push(it.summary); }
    state.synced = {at:Date.now(), days}; save(); renderSettings(); render(); toast(`동기화 완료 · ${Object.keys(days).length}일`);
  } catch(e){ toast('동기화 실패 — 키 또는 네트워크를 확인하세요 ('+e.message+')'); }
}

render();

if ('serviceWorker' in navigator && /^https:|^http:\/\/localhost/.test(location.href)){
  navigator.serviceWorker.register('sw.js').catch(()=>{});
}
</script>
